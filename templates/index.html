<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run Split Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    #map { height: 320px; width: 100%; border-radius: 0.375rem; background: #444; }
    #splits-list { max-height: 260px; overflow-y: auto; }
    .stat-value { font-size: clamp(1.05rem, 5vw, 1.5rem); }

    #pace-chart { height: 200px; }
    #pace-chart svg { display: block; overflow: visible; touch-action: pan-y; }
    #pace-chart svg:focus { outline: none; }
    #pace-chart svg:focus-visible { outline: 2px solid #0d6efd; outline-offset: 4px; border-radius: 2px; }
    #pace-chart .tick { font-size: 11px; fill: #495057; font-variant-numeric: tabular-nums; }
    #pace-chart .extreme-label { font-size: 11px; font-weight: 600; fill: #212529; }
    .pace-tooltip {
      position: absolute; pointer-events: none; white-space: nowrap;
      background: #212529; color: #fff; font-size: 0.8rem;
      padding: 0.2rem 0.5rem; border-radius: 0.25rem;
      transform: translateY(calc(-100% - 12px));
    }

    @media (max-width: 400px) {
      #map { height: 240px; }
      .stat-card .card-body { padding: 0.65rem 0.4rem; }
    }
  </style>
</head>
<body class="bg-dark text-light">
  <div class="container py-3 py-md-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h1 class="h3 mb-0">Run Split Tracker</h1>
      <span id="status-badge" class="badge bg-secondary fs-6">Loading...</span>
    </div>

    <div class="row g-2 g-md-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="card stat-card bg-secondary-subtle text-dark h-100">
          <div class="card-body text-center">
            <div class="text-muted small">Distance</div>
            <div id="stat-distance" class="stat-value fw-bold">-</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat-card bg-secondary-subtle text-dark h-100">
          <div class="card-body text-center">
            <div class="text-muted small">Moving Time</div>
            <div id="stat-moving" class="stat-value fw-bold">-</div>
            <div id="stat-elapsed" class="text-muted small"></div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat-card bg-secondary-subtle text-dark h-100">
          <div class="card-body text-center">
            <div class="text-muted small">Average Pace</div>
            <div id="stat-avg-pace" class="stat-value fw-bold">-</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat-card bg-secondary-subtle text-dark h-100">
          <div class="card-body text-center">
            <div id="stat-fourth-label" class="text-muted small">Current Pace</div>
            <div id="stat-fourth-value" class="stat-value fw-bold">-</div>
          </div>
        </div>
      </div>
    </div>

    <div id="goal-card" class="card bg-secondary-subtle text-dark mb-4" hidden>
      <div class="card-body">
        <div class="d-flex justify-content-between small text-muted mb-1 flex-wrap gap-1">
          <span id="goal-label">Goal</span>
          <span id="goal-eta"></span>
        </div>
        <div class="progress" role="progressbar" aria-label="Goal progress">
          <div id="goal-progress-bar" class="progress-bar bg-success" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="card bg-secondary-subtle text-dark mb-4">
      <div class="card-header">Route</div>
      <div id="map"></div>
    </div>

    <div id="pace-chart-card" class="card bg-secondary-subtle text-dark mb-4" hidden>
      <div class="card-header">Pace per Mile</div>
      <div class="card-body pb-2">
        <div id="pace-chart" class="position-relative"></div>
      </div>
    </div>

    <div class="card bg-secondary-subtle text-dark mb-4">
      <div class="card-header">Mile Splits</div>
      <ul id="splits-list" class="list-group list-group-flush">
        <li class="list-group-item text-muted">No splits yet</li>
      </ul>
    </div>

    <div>
      <button id="admin-login-btn" class="btn btn-sm btn-outline-secondary">Admin Login</button>

      <div id="admin-login-box" class="card bg-secondary-subtle text-dark mt-2" style="max-width: 360px;" hidden>
        <div class="card-body">
          <div class="input-group">
            <input type="password" id="admin-password" class="form-control" placeholder="Admin password">
            <button id="admin-login-submit" class="btn btn-primary">Unlock</button>
          </div>
          <div id="admin-login-error" class="small text-danger mt-2"></div>
        </div>
      </div>

      <div id="admin-panel" class="card bg-secondary-subtle text-dark mt-2" hidden>
        <div class="card-header d-flex justify-content-between align-items-center">
          Admin
          <button id="admin-lock-btn" class="btn btn-sm btn-outline-secondary">Lock</button>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label small text-muted">Test mode (DM every few seconds instead of at real checkpoints)</label>
            <div>
              <button id="admin-enable" class="btn btn-warning btn-sm">Enable Test Mode</button>
              <button id="admin-disable" class="btn btn-outline-secondary btn-sm">Disable</button>
            </div>
          </div>
          <div>
            <label for="admin-goal-input" class="form-label small text-muted">
              Goal distance (miles, 0.01-99.99)
            </label>
            <div class="input-group" style="max-width: 100%; width: 320px;">
              <input type="number" id="admin-goal-input" class="form-control" step="0.01" min="0.01" max="99.99" placeholder="e.g. 13.1">
              <button id="admin-goal-set" class="btn btn-primary">Set</button>
              <button id="admin-goal-clear" class="btn btn-outline-secondary">Clear</button>
            </div>
          </div>
          <div class="mt-3">
            <label class="form-label small text-muted" for="admin-target-enabled">
              Target pace (optional - adds "faster/slower than target" to pace DMs)
            </label>
            <div class="d-flex flex-wrap align-items-center gap-2">
              <div class="form-check form-switch m-0">
                <input class="form-check-input" type="checkbox" role="switch" id="admin-target-enabled">
                <label class="form-check-label small" for="admin-target-enabled">On</label>
              </div>
              <select id="admin-target-min" class="form-select form-select-sm w-auto" aria-label="Target pace minutes"></select>
              <span>:</span>
              <select id="admin-target-sec" class="form-select form-select-sm w-auto" aria-label="Target pace seconds"></select>
              <span class="small text-muted">/mi</span>
            </div>
          </div>
          <hr>
          <div>
            <label class="form-label small text-muted">Danger zone</label>
            <div>
              <button id="admin-reset" class="btn btn-danger btn-sm">Reset Run Data</button>
            </div>
            <div class="small text-muted mt-1">Clears the map, splits, and stats back to a blank state. Does not touch your goal distance or test mode setting.</div>
          </div>
          <div id="admin-status" class="small text-muted mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);

    let routeLine = L.polyline([], { color: '#0d6efd', weight: 4 }).addTo(map);
    let currentMarker = null;
    let mapCentered = false;

    function updateMap(path) {
      if (!path || !path.length) {
        routeLine.setLatLngs([]);
        if (currentMarker) {
          map.removeLayer(currentMarker);
          currentMarker = null;
        }
        mapCentered = false;
        return;
      }

      const latLngs = path.map(p => [p[0], p[1]]);
      routeLine.setLatLngs(latLngs);

      const last = latLngs[latLngs.length - 1];
      if (!currentMarker) {
        currentMarker = L.circleMarker(last, { radius: 7, color: '#dc3545', fillOpacity: 1 }).addTo(map);
      } else {
        currentMarker.setLatLng(last);
      }

      if (!mapCentered) {
        map.setView(last, 16);
        mapCentered = true;
      } else {
        map.panTo(last);
      }
    }

    function updateGoal(data) {
      const card = document.getElementById('goal-card');
      if (!data.goal_distance_miles) {
        card.hidden = true;
        return;
      }
      card.hidden = false;
      document.getElementById('goal-label').textContent =
        `Goal: ${(data.distance_miles ?? 0).toFixed(2)} / ${data.goal_distance_miles.toFixed(2)} mi`;
      document.getElementById('goal-eta').textContent = data.eta_display ? `ETA: ${data.eta_display}` : '';
      document.getElementById('goal-progress-bar').style.width = (data.goal_progress_percent ?? 0) + '%';
    }

    // --- Pace per mile chart: one line, one dot per completed mile, faster
    // paces plotted higher. Hover/tap/arrow keys show a tooltip; the splits
    // list below is the table view with every value.
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const CHART_HEIGHT = 200;
    let lastSplits = [];
    let lastTarget = null;
    let activeIndex = null;

    function fmtPace(seconds) {
      const s = Math.round(seconds);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function svgEl(tag, attrs) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function renderPaceChart() {
      const card = document.getElementById('pace-chart-card');
      const splits = lastSplits;
      if (splits.length < 2) {
        card.hidden = true;
        activeIndex = null;
        return;
      }
      card.hidden = false;

      const container = document.getElementById('pace-chart');
      const width = container.clientWidth;
      const m = { top: 22, right: 14, bottom: 26, left: 42 };
      const plotW = width - m.left - m.right;
      const plotH = CHART_HEIGHT - m.top - m.bottom;

      const paces = splits.map(s => s.pace_seconds);
      const target = lastTarget;
      const extent = target ? [...paces, target] : paces;  // keep the target line in view
      let tickStep = 15;
      let lo = Math.floor(Math.min(...extent) / tickStep) * tickStep;
      let hi = Math.ceil(Math.max(...extent) / tickStep) * tickStep;
      while ((hi - lo) / tickStep > 4) {
        tickStep *= 2;
        lo = Math.floor(Math.min(...extent) / tickStep) * tickStep;
        hi = Math.ceil(Math.max(...extent) / tickStep) * tickStep;
      }
      if (hi === lo) { lo -= tickStep; hi += tickStep; }

      const x = i => m.left + (i * plotW) / (splits.length - 1);
      const y = p => m.top + ((p - lo) / (hi - lo)) * plotH;  // faster (smaller) = higher

      const svg = svgEl('svg', {
        width, height: CHART_HEIGHT, tabindex: 0, role: 'img',
        'aria-label': 'Pace per mile. ' + splits.map(s => `Mile ${s.mile}: ${s.pace_display}`).join(', '),
      });

      for (let t = lo; t <= hi; t += tickStep) {
        svg.appendChild(svgEl('line', { x1: m.left, x2: width - m.right, y1: y(t), y2: y(t), stroke: '#c8cacd', 'stroke-width': 1 }));
        const label = svgEl('text', { x: m.left - 8, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' });
        label.textContent = fmtPace(t);
        svg.appendChild(label);
      }

      const labelEvery = Math.ceil(splits.length / Math.max(1, Math.floor(plotW / 28)));
      splits.forEach((s, i) => {
        if (i % labelEvery !== 0 && i !== splits.length - 1) return;
        const label = svgEl('text', { x: x(i), y: CHART_HEIGHT - 6, 'text-anchor': 'middle', class: 'tick' });
        label.textContent = s.mile;
        svg.appendChild(label);
      });

      if (target) {
        svg.appendChild(svgEl('line', { x1: m.left, x2: width - m.right, y1: y(target), y2: y(target), stroke: '#6c757d', 'stroke-width': 1.5 }));
        const targetLabel = svgEl('text', { x: width - m.right, y: y(target) - 5, 'text-anchor': 'end', class: 'tick' });
        targetLabel.textContent = `Target ${fmtPace(target)}`;
        svg.appendChild(targetLabel);
      }

      const crosshair = svgEl('line', { y1: m.top, y2: m.top + plotH, stroke: '#adb5bd', 'stroke-width': 1, visibility: 'hidden' });
      svg.appendChild(crosshair);

      svg.appendChild(svgEl('polyline', {
        points: splits.map((s, i) => `${x(i)},${y(s.pace_seconds)}`).join(' '),
        fill: 'none', stroke: '#0d6efd', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      }));

      const dots = splits.map((s, i) => {
        const dot = svgEl('circle', { cx: x(i), cy: y(s.pace_seconds), r: 4, fill: '#0d6efd', stroke: '#e2e3e5', 'stroke-width': 2 });
        svg.appendChild(dot);
        return dot;
      });

      // Label only the extreme: the fastest mile.
      const fastestIdx = paces.indexOf(Math.min(...paces));
      const fastLabel = svgEl('text', { x: x(fastestIdx), y: y(paces[fastestIdx]) - 10, 'text-anchor': 'middle', class: 'extreme-label' });
      fastLabel.textContent = splits[fastestIdx].pace_display.replace('/mi', '');
      svg.appendChild(fastLabel);

      const tooltip = document.createElement('div');
      tooltip.className = 'pace-tooltip';
      tooltip.hidden = true;

      function show(i) {
        activeIndex = i;
        dots.forEach((d, j) => d.setAttribute('r', j === i ? 6 : 4));
        crosshair.setAttribute('x1', x(i));
        crosshair.setAttribute('x2', x(i));
        crosshair.setAttribute('visibility', 'visible');
        tooltip.textContent = `Mile ${splits[i].mile} · ${splits[i].pace_display}`;
        tooltip.hidden = false;
        const tipW = tooltip.offsetWidth;
        tooltip.style.left = `${Math.max(0, Math.min(width - tipW, x(i) - tipW / 2))}px`;
        tooltip.style.top = `${y(splits[i].pace_seconds)}px`;
      }

      function hide() {
        activeIndex = null;
        dots.forEach(d => d.setAttribute('r', 4));
        crosshair.setAttribute('visibility', 'hidden');
        tooltip.hidden = true;
      }

      function nearestIndex(clientX) {
        const px = clientX - svg.getBoundingClientRect().left;
        return Math.max(0, Math.min(splits.length - 1, Math.round(((px - m.left) / plotW) * (splits.length - 1))));
      }

      svg.addEventListener('pointermove', e => show(nearestIndex(e.clientX)));
      svg.addEventListener('pointerdown', e => show(nearestIndex(e.clientX)));
      svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
      svg.addEventListener('blur', hide);
      svg.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          e.preventDefault();
          const step = e.key === 'ArrowRight' ? 1 : -1;
          show(Math.max(0, Math.min(splits.length - 1, (activeIndex ?? (step > 0 ? -1 : splits.length)) + step)));
        } else if (e.key === 'Escape') {
          hide();
        }
      });

      // Chart re-renders on every 3s poll - keep whatever the viewer was
      // inspecting (captured first, since removing the old svg can blur it).
      const keepIndex = activeIndex;
      const hadFocus = container.contains(document.activeElement);
      container.replaceChildren(svg, tooltip);
      if (hadFocus) svg.focus({ preventScroll: true });
      if (keepIndex !== null && keepIndex < splits.length) show(keepIndex);
    }

    window.addEventListener('resize', renderPaceChart);

    async function refresh() {
      try {
        const res = await fetch('/status');
        const data = await res.json();

        const badge = document.getElementById('status-badge');
        if (data.active && data.paused) {
          badge.textContent = 'Paused';
          badge.className = 'badge fs-6 bg-warning text-dark';
        } else {
          badge.textContent = data.active ? 'Active' : 'No active trip';
          badge.className = 'badge fs-6 ' + (data.active ? 'bg-success' : 'bg-secondary');
        }

        document.getElementById('stat-distance').textContent =
          (data.distance_miles ?? 0).toFixed(2) + ' mi';
        document.getElementById('stat-moving').textContent = data.moving_display || '-';
        document.getElementById('stat-elapsed').textContent =
          data.elapsed_display && data.elapsed_display !== data.moving_display ? `Elapsed ${data.elapsed_display}` : '';
        document.getElementById('stat-avg-pace').textContent = data.average_pace_display || '-';
        const fourthLabel = document.getElementById('stat-fourth-label');
        const fourthValue = document.getElementById('stat-fourth-value');
        if (data.active) {
          fourthLabel.textContent = 'Current Pace';
          fourthValue.textContent = data.paused ? 'Paused' : (data.current_pace_display || '-');
        } else {
          fourthLabel.textContent = data.fastest_split ? `Fastest (Mile ${data.fastest_split.mile})` : 'Fastest Mile';
          fourthValue.textContent = data.fastest_split ? data.fastest_split.pace_display : '-';
        }

        updateMap(data.path);
        updateGoal(data);
        lastSplits = data.splits || [];
        lastTarget = data.target_pace_seconds || null;
        renderPaceChart();

        const list = document.getElementById('splits-list');
        const rows = (data.splits || [])
          .slice()
          .reverse()
          .map(s => `<li class="list-group-item">Mile ${s.mile}: ${s.pace_display}</li>`);
        if (data.partial_split) {
          const p = data.partial_split;
          const label = data.active ? `${p.distance_miles.toFixed(2)} mi so far` : `${p.distance_miles.toFixed(2)} mi`;
          rows.unshift(`<li class="list-group-item ${data.active ? 'text-muted fst-italic' : ''}">${label}: ${p.pace_display}</li>`);
        }
        list.innerHTML = rows.length
          ? rows.join('')
          : '<li class="list-group-item text-muted">No splits yet</li>';
      } catch (err) {
        console.error('status refresh failed', err);
      }
    }

    refresh();
    setInterval(refresh, 3000);

    // --- Admin panel: fully hidden and inert until the correct password is
    // entered. This is a UX gate, not the real security boundary - the
    // server checks the password on every /admin/settings request no matter
    // what the page shows or hides.
    let adminPassword = sessionStorage.getItem('adminPassword') || '';

    function showLoggedIn() {
      document.getElementById('admin-login-btn').hidden = true;
      document.getElementById('admin-login-box').hidden = true;
      document.getElementById('admin-panel').hidden = false;
    }

    function showLoggedOut() {
      adminPassword = '';
      sessionStorage.removeItem('adminPassword');
      document.getElementById('admin-login-btn').hidden = false;
      document.getElementById('admin-login-box').hidden = true;
      document.getElementById('admin-panel').hidden = true;
    }

    async function callAdminSettings(extra) {
      const res = await fetch('/admin/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword, ...extra }),
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    }

    const targetMin = document.getElementById('admin-target-min');
    const targetSec = document.getElementById('admin-target-sec');
    const targetEnabled = document.getElementById('admin-target-enabled');
    for (let m = 1; m <= 10; m++) targetMin.add(new Option(String(m), String(m)));
    for (let s = 0; s <= 59; s++) targetSec.add(new Option(String(s).padStart(2, '0'), String(s)));

    function fillAdminControls(data) {
      document.getElementById('admin-goal-input').value = data.goal_distance_miles ?? '';
      const target = data.target_pace_seconds ?? 450;  // default the dropdowns to 7:30
      targetMin.value = String(Math.floor(target / 60));
      targetSec.value = String(target % 60);
      targetEnabled.checked = !!data.target_pace_enabled;
    }

    document.getElementById('admin-login-btn').addEventListener('click', () => {
      document.getElementById('admin-login-box').hidden = false;
    });

    document.getElementById('admin-login-submit').addEventListener('click', async () => {
      const entered = document.getElementById('admin-password').value;
      const errEl = document.getElementById('admin-login-error');
      adminPassword = entered;
      try {
        const { ok, status, data } = await callAdminSettings({});
        if (!ok) {
          errEl.textContent = status === 401 ? 'Incorrect password.' : (data.error || 'Login failed.');
          adminPassword = '';
          return;
        }
        sessionStorage.setItem('adminPassword', entered);
        errEl.textContent = '';
        fillAdminControls(data);
        showLoggedIn();
      } catch (err) {
        errEl.textContent = 'Request failed - check the console.';
        console.error('admin login failed', err);
      }
    });

    document.getElementById('admin-lock-btn').addEventListener('click', showLoggedOut);

    function showSaved(statusEl, message, okClass, data) {
      if (data.saved === false) {
        statusEl.textContent = `${message} Couldn't save it to the database, so it resets on restart.`;
        statusEl.className = 'small mt-3 text-warning-emphasis';
      } else {
        statusEl.textContent = message;
        statusEl.className = `small mt-3 ${okClass}`;
      }
    }

    async function setTestMode(enabled) {
      const statusEl = document.getElementById('admin-status');
      try {
        const { ok, status, data } = await callAdminSettings({ discord_test_mode: enabled });
        if (!ok) {
          if (status === 401) showLoggedOut();
          statusEl.textContent = data.error || 'Request failed.';
          statusEl.className = 'small text-danger mt-3';
          return;
        }
        showSaved(statusEl, 'Test mode is now ' + (data.discord_test_mode ? 'ON' : 'OFF') + '.',
                  data.discord_test_mode ? 'text-warning-emphasis' : 'text-success', data);
      } catch (err) {
        statusEl.textContent = 'Request failed - check the console.';
        statusEl.className = 'small text-danger mt-3';
        console.error('admin test-mode request failed', err);
      }
    }

    async function setGoal(value) {
      const statusEl = document.getElementById('admin-status');
      try {
        const { ok, status, data } = await callAdminSettings({ goal_distance_miles: value });
        if (!ok) {
          if (status === 401) showLoggedOut();
          statusEl.textContent = data.error || 'Request failed.';
          statusEl.className = 'small text-danger mt-3';
          return;
        }
        showSaved(statusEl, data.goal_distance_miles
          ? `Goal set to ${data.goal_distance_miles.toFixed(2)} mi.`
          : 'Goal cleared.', 'text-success', data);
        document.getElementById('admin-goal-input').value = data.goal_distance_miles ?? '';
      } catch (err) {
        statusEl.textContent = 'Request failed - check the console.';
        statusEl.className = 'small text-danger mt-3';
        console.error('admin goal request failed', err);
      }
    }

    async function saveTargetPace() {
      const statusEl = document.getElementById('admin-status');
      const seconds = Number(targetMin.value) * 60 + Number(targetSec.value);
      try {
        const { ok, status, data } = await callAdminSettings({
          target_pace_seconds: seconds,
          target_pace_enabled: targetEnabled.checked,
        });
        if (!ok) {
          if (status === 401) showLoggedOut();
          statusEl.textContent = data.error || 'Request failed.';
          statusEl.className = 'small text-danger mt-3';
          return;
        }
        fillAdminControls(data);
        const pace = `${Math.floor(data.target_pace_seconds / 60)}:${String(data.target_pace_seconds % 60).padStart(2, '0')}/mi`;
        showSaved(statusEl, data.target_pace_enabled ? `Target pace on: ${pace}.` : 'Target pace off.', 'text-success', data);
        refresh();
      } catch (err) {
        statusEl.textContent = 'Request failed - check the console.';
        statusEl.className = 'small text-danger mt-3';
        console.error('admin target pace request failed', err);
      }
    }

    [targetMin, targetSec, targetEnabled].forEach(el => el.addEventListener('change', saveTargetPace));

    async function resetRunData() {
      const statusEl = document.getElementById('admin-status');
      if (!confirm('Clear the current map, splits, and stats? This cannot be undone.')) return;

      try {
        const res = await fetch('/admin/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (res.status === 401) showLoggedOut();
          statusEl.textContent = data.error || 'Request failed.';
          statusEl.className = 'small text-danger mt-3';
          return;
        }
        statusEl.textContent = 'Run data reset.';
        statusEl.className = 'small mt-3 text-success';
        refresh();
      } catch (err) {
        statusEl.textContent = 'Request failed - check the console.';
        statusEl.className = 'small text-danger mt-3';
        console.error('admin reset request failed', err);
      }
    }

    document.getElementById('admin-enable').addEventListener('click', () => setTestMode(true));
    document.getElementById('admin-disable').addEventListener('click', () => setTestMode(false));
    document.getElementById('admin-goal-set').addEventListener('click', () => {
      const val = document.getElementById('admin-goal-input').value;
      setGoal(val === '' ? null : Number(val));
    });
    document.getElementById('admin-goal-clear').addEventListener('click', () => setGoal(null));
    document.getElementById('admin-reset').addEventListener('click', resetRunData);

    // If a password was already unlocked earlier this browser session, skip
    // straight to the panel instead of prompting again.
    if (adminPassword) {
      callAdminSettings({}).then(({ ok, data }) => {
        if (ok) {
          fillAdminControls(data);
          showLoggedIn();
        } else {
          showLoggedOut();
        }
      });
    }
  </script>
</body>
</html>
