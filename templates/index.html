<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run Split Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    #map { height: 320px; width: 100%; border-radius: 0.375rem; background: #444; }
    #splits-list { max-height: 260px; overflow-y: auto; }
  </style>
</head>
<body class="bg-dark text-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">Run Split Tracker</h1>
      <span id="status-badge" class="badge bg-secondary fs-6">Loading...</span>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="card bg-secondary-subtle text-dark h-100">
          <div class="card-body text-center">
            <div class="text-muted small">Distance</div>
            <div id="stat-distance" class="fs-4 fw-bold">-</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card bg-secondary-subtle text-dark h-100">
          <div class="card-body text-center">
            <div class="text-muted small">Elapsed</div>
            <div id="stat-elapsed" class="fs-4 fw-bold">-</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card bg-secondary-subtle text-dark h-100">
          <div class="card-body text-center">
            <div class="text-muted small">Average Pace</div>
            <div id="stat-avg-pace" class="fs-4 fw-bold">-</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card bg-secondary-subtle text-dark h-100">
          <div class="card-body text-center">
            <div class="text-muted small">Current Pace</div>
            <div id="stat-current-pace" class="fs-4 fw-bold">-</div>
          </div>
        </div>
      </div>
    </div>

    <div id="goal-card" class="card bg-secondary-subtle text-dark mb-4" hidden>
      <div class="card-body">
        <div class="d-flex justify-content-between small text-muted mb-1">
          <span id="goal-label">Goal</span>
          <span id="goal-eta"></span>
        </div>
        <div class="progress" role="progressbar" aria-label="Goal progress">
          <div id="goal-progress-bar" class="progress-bar bg-success" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="card bg-secondary-subtle text-dark mb-4">
      <div class="card-header">Route</div>
      <div id="map"></div>
    </div>

    <div class="card bg-secondary-subtle text-dark mb-4">
      <div class="card-header">Mile Splits</div>
      <ul id="splits-list" class="list-group list-group-flush">
        <li class="list-group-item text-muted">No splits yet</li>
      </ul>
    </div>

    <div>
      <button id="admin-login-btn" class="btn btn-sm btn-outline-secondary">Admin Login</button>

      <div id="admin-login-box" class="card bg-secondary-subtle text-dark mt-2" style="max-width: 360px;" hidden>
        <div class="card-body">
          <div class="input-group">
            <input type="password" id="admin-password" class="form-control" placeholder="Admin password">
            <button id="admin-login-submit" class="btn btn-primary">Unlock</button>
          </div>
          <div id="admin-login-error" class="small text-danger mt-2"></div>
        </div>
      </div>

      <div id="admin-panel" class="card bg-secondary-subtle text-dark mt-2" hidden>
        <div class="card-header d-flex justify-content-between align-items-center">
          Admin
          <button id="admin-lock-btn" class="btn btn-sm btn-outline-secondary">Lock</button>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label small text-muted">Test mode (DM every few seconds instead of at real checkpoints)</label>
            <div>
              <button id="admin-enable" class="btn btn-warning btn-sm">Enable Test Mode</button>
              <button id="admin-disable" class="btn btn-outline-secondary btn-sm">Disable</button>
            </div>
          </div>
          <div>
            <label for="admin-goal-input" class="form-label small text-muted">
              Goal distance (miles, 0.01-99.99)
            </label>
            <div class="input-group" style="max-width: 320px;">
              <input type="number" id="admin-goal-input" class="form-control" step="0.01" min="0.01" max="99.99" placeholder="e.g. 13.1">
              <button id="admin-goal-set" class="btn btn-primary">Set</button>
              <button id="admin-goal-clear" class="btn btn-outline-secondary">Clear</button>
            </div>
          </div>
          <div id="admin-status" class="small text-muted mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);

    let routeLine = L.polyline([], { color: '#0d6efd', weight: 4 }).addTo(map);
    let currentMarker = null;
    let mapCentered = false;

    function updateMap(path) {
      if (!path || !path.length) return;

      const latLngs = path.map(p => [p[0], p[1]]);
      routeLine.setLatLngs(latLngs);

      const last = latLngs[latLngs.length - 1];
      if (!currentMarker) {
        currentMarker = L.circleMarker(last, { radius: 7, color: '#dc3545', fillOpacity: 1 }).addTo(map);
      } else {
        currentMarker.setLatLng(last);
      }

      if (!mapCentered) {
        map.setView(last, 16);
        mapCentered = true;
      } else {
        map.panTo(last);
      }
    }

    function updateGoal(data) {
      const card = document.getElementById('goal-card');
      if (!data.goal_distance_miles) {
        card.hidden = true;
        return;
      }
      card.hidden = false;
      document.getElementById('goal-label').textContent =
        `Goal: ${(data.distance_miles ?? 0).toFixed(2)} / ${data.goal_distance_miles.toFixed(2)} mi`;
      document.getElementById('goal-eta').textContent = data.eta_display ? `ETA: ${data.eta_display}` : '';
      document.getElementById('goal-progress-bar').style.width = (data.goal_progress_percent ?? 0) + '%';
    }

    async function refresh() {
      try {
        const res = await fetch('/status');
        const data = await res.json();

        const badge = document.getElementById('status-badge');
        badge.textContent = data.active ? 'Active' : 'No active trip';
        badge.className = 'badge fs-6 ' + (data.active ? 'bg-success' : 'bg-secondary');

        document.getElementById('stat-distance').textContent =
          (data.distance_miles ?? 0).toFixed(2) + ' mi';
        document.getElementById('stat-elapsed').textContent = data.elapsed_display || '-';
        document.getElementById('stat-avg-pace').textContent = data.average_pace_display || '-';
        document.getElementById('stat-current-pace').textContent = data.current_pace_display || '-';

        updateMap(data.path);
        updateGoal(data);

        const list = document.getElementById('splits-list');
        if (data.splits && data.splits.length) {
          list.innerHTML = data.splits
            .slice()
            .reverse()
            .map(s => `<li class="list-group-item">Mile ${s.mile}: ${s.pace_display}</li>`)
            .join('');
        } else {
          list.innerHTML = '<li class="list-group-item text-muted">No splits yet</li>';
        }
      } catch (err) {
        console.error('status refresh failed', err);
      }
    }

    refresh();
    setInterval(refresh, 3000);

    // --- Admin panel: fully hidden and inert until the correct password is
    // entered. This is a UX gate, not the real security boundary - the
    // server checks the password on every /admin/settings request no matter
    // what the page shows or hides.
    let adminPassword = sessionStorage.getItem('adminPassword') || '';

    function showLoggedIn() {
      document.getElementById('admin-login-btn').hidden = true;
      document.getElementById('admin-login-box').hidden = true;
      document.getElementById('admin-panel').hidden = false;
    }

    function showLoggedOut() {
      adminPassword = '';
      sessionStorage.removeItem('adminPassword');
      document.getElementById('admin-login-btn').hidden = false;
      document.getElementById('admin-login-box').hidden = true;
      document.getElementById('admin-panel').hidden = true;
    }

    async function callAdminSettings(extra) {
      const res = await fetch('/admin/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword, ...extra }),
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    }

    document.getElementById('admin-login-btn').addEventListener('click', () => {
      document.getElementById('admin-login-box').hidden = false;
    });

    document.getElementById('admin-login-submit').addEventListener('click', async () => {
      const entered = document.getElementById('admin-password').value;
      const errEl = document.getElementById('admin-login-error');
      adminPassword = entered;
      try {
        const { ok, status, data } = await callAdminSettings({});
        if (!ok) {
          errEl.textContent = status === 401 ? 'Incorrect password.' : (data.error || 'Login failed.');
          adminPassword = '';
          return;
        }
        sessionStorage.setItem('adminPassword', entered);
        errEl.textContent = '';
        document.getElementById('admin-goal-input').value = data.goal_distance_miles ?? '';
        showLoggedIn();
      } catch (err) {
        errEl.textContent = 'Request failed - check the console.';
        console.error('admin login failed', err);
      }
    });

    document.getElementById('admin-lock-btn').addEventListener('click', showLoggedOut);

    async function setTestMode(enabled) {
      const statusEl = document.getElementById('admin-status');
      try {
        const { ok, status, data } = await callAdminSettings({ discord_test_mode: enabled });
        if (!ok) {
          if (status === 401) showLoggedOut();
          statusEl.textContent = data.error || 'Request failed.';
          statusEl.className = 'small text-danger mt-3';
          return;
        }
        statusEl.textContent = 'Test mode is now ' + (data.discord_test_mode ? 'ON' : 'OFF') + '.';
        statusEl.className = 'small mt-3 ' + (data.discord_test_mode ? 'text-warning' : 'text-success');
      } catch (err) {
        statusEl.textContent = 'Request failed - check the console.';
        statusEl.className = 'small text-danger mt-3';
        console.error('admin test-mode request failed', err);
      }
    }

    async function setGoal(value) {
      const statusEl = document.getElementById('admin-status');
      try {
        const { ok, status, data } = await callAdminSettings({ goal_distance_miles: value });
        if (!ok) {
          if (status === 401) showLoggedOut();
          statusEl.textContent = data.error || 'Request failed.';
          statusEl.className = 'small text-danger mt-3';
          return;
        }
        statusEl.textContent = data.goal_distance_miles
          ? `Goal set to ${data.goal_distance_miles.toFixed(2)} mi.`
          : 'Goal cleared.';
        statusEl.className = 'small mt-3 text-success';
        document.getElementById('admin-goal-input').value = data.goal_distance_miles ?? '';
      } catch (err) {
        statusEl.textContent = 'Request failed - check the console.';
        statusEl.className = 'small text-danger mt-3';
        console.error('admin goal request failed', err);
      }
    }

    document.getElementById('admin-enable').addEventListener('click', () => setTestMode(true));
    document.getElementById('admin-disable').addEventListener('click', () => setTestMode(false));
    document.getElementById('admin-goal-set').addEventListener('click', () => {
      const val = document.getElementById('admin-goal-input').value;
      setGoal(val === '' ? null : Number(val));
    });
    document.getElementById('admin-goal-clear').addEventListener('click', () => setGoal(null));

    // If a password was already unlocked earlier this browser session, skip
    // straight to the panel instead of prompting again.
    if (adminPassword) {
      callAdminSettings({}).then(({ ok, data }) => {
        if (ok) {
          document.getElementById('admin-goal-input').value = data.goal_distance_miles ?? '';
          showLoggedIn();
        } else {
          showLoggedOut();
        }
      });
    }
  </script>
</body>
</html>
